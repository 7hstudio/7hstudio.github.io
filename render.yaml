services:
  - type: web
    name: 7h-studios
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: CLIENT_ID
        value: "1560743842775568504"
      - key: GUILD_ID
        value: "1418023065560023052"
      - key: DISCORD_TOKEN
        sync: false
      - key: DOMAIN
        sync: false
